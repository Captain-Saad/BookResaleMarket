[project]
name = "bookloop-api"
version = "0.1.0"
description = "BookLoop backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "arq==0.28.0",
    "asyncpg==0.32.0",
    "bcrypt==5.0.0",
    "email-validator==2.3.0",
    "fastapi==0.143.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.5",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "hypothesis==6.170.1",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "testcontainers[postgres]==4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]
"alembic/versions/**" = ["S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not db and not redis'"
markers = [
    "db: needs the real database from backend/.env (run with: uv run pytest -m db)",
    "redis: needs Redis from docker compose (run with: uv run pytest -m redis)",
]
